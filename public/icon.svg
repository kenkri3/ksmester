<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Vikingnet Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>

    <!-- Electric Purple Brand Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B042FF" />
      <stop offset="50%" stop-color="#9D00FF" />
      <stop offset="100%" stop-color="#6B00B6" />
    </linearGradient>

    <!-- Viking Amber Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Midnight Navy -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Purple Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#purpleGrad)" stroke-width="10" stroke-opacity="0.75" />

  <!-- Viking Shield / Chevron Outer Wings (V-Shape for Viking) -->
  <path d="M120 130 L256 70 L392 130 L392 270 C392 370 256 442 256 442 C256 442 120 370 120 270 Z" 
        fill="#0D203D" 
        stroke="url(#purpleGrad)" 
        stroke-width="16" 
        stroke-linejoin="round" />

  <!-- Inner Shield Inset Line -->
  <path d="M148 152 L256 104 L364 152 L364 260 C364 340 256 404 256 404 C256 404 148 340 148 260 Z" 
        fill="#081426" 
        stroke="#1E3A66" 
        stroke-width="6" 
        stroke-linejoin="round" />

  <!-- Master Craftsman Hammer Head (Solid Golden Heavy-Duty Head) -->
  <path d="M184 176 L328 176 C336 176 342 182 342 190 L342 226 C342 234 336 240 328 240 L184 240 C176 240 170 234 170 226 L170 190 C170 182 176 176 184 176 Z" 
        fill="url(#goldGrad)" 
        filter="url(#softGlow)" />

  <!-- Hammer Bevel Highlight -->
  <path d="M188 182 L324 182 C328 182 332 185 332 189 L332 195 L180 195 L180 189 C180 185 184 182 188 182 Z" 
        fill="#FEF3C7" 
        fill-opacity="0.8" />

  <!-- Precision Level / Hammer Handle in Stainless Steel & Gold -->
  <rect x="242" y="240" width="28" height="150" rx="8" fill="#F8FAFC" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Handle Grip Bands -->
  <rect x="242" y="310" width="28" height="8" fill="#9D00FF" />
  <rect x="242" y="330" width="28" height="8" fill="#9D00FF" />
  <rect x="242" y="350" width="28" height="8" fill="#9D00FF" />

  <!-- Precision Star / Sparkle in Top Right (Autonomous Intelligence) -->
  <path d="M370 100 Q390 100 390 80 Q390 100 410 100 Q390 100 390 120 Q390 100 370 100 Z" 
        fill="url(#goldGrad)" 
        filter="url(#softGlow)" />
</svg>
