name: CI Test & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repository
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer avhengigheter
        run: npm ci

      - name: Typesjekk (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Next.js Produksjonsbygg
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://vikingmester.no"
          NODE_ENV: "production"
